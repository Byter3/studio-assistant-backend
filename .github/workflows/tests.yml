name: Backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run offline tests
        run: python -m unittest discover -s tests -q

  gateway-source:
    name: Build optional gateway source bundle
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build source archive
        run: python scripts/package_gateway.py
      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/houlm-gateway-1.103.2-streamfix2.tar.gz
          archive: false
          if-no-files-found: error
